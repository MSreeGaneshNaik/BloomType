<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Type a word and grow a living garden around it. Roses, blossom or meadow; export MP4, PNG frames, HTML or embed code.">
<meta property="og:title" content="BloomType">
<meta property="og:description" content="Type a word and grow a living garden around it.">
<meta property="og:image" content="https://msreeganeshnaik.github.io/BloomType/assets/preview.png">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.png">
<title>BloomType</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400&family=Instrument+Serif&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Pinyon+Script&family=Playfair+Display:wght@400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400&family=Instrument+Serif&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Pinyon+Script&family=Playfair+Display:wght@400&display=swap"></noscript>
<style>
/* Layout: fixed tool panel on the left, full-bleed living poster on the right; panel becomes a bottom sheet on phones. */
:root{
  --chrome:#0A0A0A;
  --card:#141414;
  --card-hover:#1B1B1B;
  --edge:rgba(237,234,228,.11);
  --edge-strong:#EDEAE4;
  --text:#EDEAE4;
  --muted:#8F8B84;
  --stage:#EEEAE3;
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--text);font:13px/1.45 var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:#EDEAE4;color:#0A0A0A}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--edge-strong);outline-offset:2px}

.app{position:relative;display:grid;grid-template-columns:var(--panel-w,316px) 1fr;height:100%;transition:grid-template-columns .5s var(--ease-out)}
.app.collapsed{--panel-w:0px}

/* ---------- panel ---------- */
.panel{position:relative;z-index:2;background:var(--chrome);overflow:hidden;min-width:0}
.panel-inner{width:316px;height:100%;box-sizing:border-box;overflow-y:auto;padding:22px 20px 28px;display:flex;flex-direction:column;gap:26px;scrollbar-width:thin;scrollbar-color:#2A2A2A transparent;transition:opacity .3s var(--ease-out),transform .5s var(--ease-out)}
.app.collapsed .panel-inner{opacity:0;transform:translateX(-24px);pointer-events:none}
.pending section + section{visibility:hidden} /* cards are built by script; hiding them until then avoids a layout shift */
.panel-inner::-webkit-scrollbar{width:8px}
.panel-inner::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:8px}

.head h1{font:600 30px/1 var(--serif);letter-spacing:-.02em;margin:0 0 6px}
.head p{margin:0;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

.group{display:flex;flex-direction:column;gap:10px}
.label{margin:0;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.word{display:block;width:100%;box-sizing:border-box;resize:none;overflow:hidden;background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:10px 14px;font:600 24px/1.2 var(--serif);letter-spacing:-.01em;caret-color:var(--text);transition:border-color .2s}
.word:focus{outline:none;border-color:var(--edge-strong)}
.word::placeholder{color:#55524D}

.btn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:8px 14px;font:500 12.5px/1 var(--mono);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--card-hover);border-color:rgba(237,234,228,.28)}
.btn:active{transform:scale(.97)}
.btn svg{width:14px;height:14px;flex:none}
.btn.spin svg{animation:spin .6s var(--ease-out)}
@keyframes spin{to{transform:rotate(360deg)}}
.meter{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meter-row label{font:500 12.5px/1 var(--mono)}
.meter-row output{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.meter input{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;cursor:pointer;--p:45%}
.meter input::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--text) var(--p),#2A2A2A var(--p))}
.meter input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--text);border:3px solid var(--chrome);box-sizing:content-box;transition:transform .15s var(--ease-out)}
.meter input:active::-webkit-slider-thumb{transform:scale(1.15)}
.meter input::-moz-range-track{height:4px;border-radius:4px;background:#2A2A2A}
.meter input::-moz-range-progress{height:4px;border-radius:4px;background:var(--text)}
.meter input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:3px solid var(--chrome)}
.meter input:focus-visible{outline:none}
.meter input:focus-visible::-webkit-slider-thumb{outline:2px solid var(--edge-strong);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0;min-height:calc(2.9em + 4px);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.stats b{color:var(--text);font-weight:500}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{position:relative;text-align:left;background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:10px 11px 11px;transition:background .15s,border-color .15s,transform .1s}
.card:hover{background:var(--card-hover)}
.card:active{transform:scale(.98)}
.card[aria-checked="true"]{border-color:var(--edge-strong);box-shadow:inset 0 0 0 .5px var(--edge-strong)}
.card .t{display:block;font:500 13px/1.2 var(--mono);margin-bottom:4px}
.card .d{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.card .face{display:block;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .face + .d{margin-top:2px}

.glyph{display:block;height:34px;margin:-2px 0 6px}
.glyph svg{height:100%;width:auto;display:block}

.swatch{display:flex;align-items:center;justify-content:center;gap:10px;height:42px;border-radius:8px;margin-bottom:8px}
.dots{position:relative;width:24px;height:14px}
.dots i{position:absolute;top:0;width:14px;height:14px;border-radius:50%}
.dots i:first-child{left:0}
.dots i:last-child{left:9px;width:12px;height:12px;top:1px}
.swatch span{font:400 19px/1 var(--serif)}
.card .n{font:500 12px/1 var(--mono)}

.seg{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:7px;padding:8px 0;font:500 12px/1 var(--mono);color:var(--muted);transition:background .15s,color .15s;font-variant-numeric:tabular-nums}
.seg button:hover{color:var(--text)}
.seg button[aria-checked="true"]{background:#262626;color:var(--text)}

.export{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xbtn{border-radius:12px;padding:12px 10px;text-align:left;background:var(--card);border:1px solid var(--edge);transition:background .15s,transform .1s}
.xbtn:hover{background:var(--card-hover)}
.xbtn:active{transform:scale(.98)}
.xbtn.primary{background:var(--text);color:#0A0A0A;border-color:var(--text)}
.xbtn.primary:hover{background:#FFFFFF}
.xbtn .t{display:block;font:500 13px/1.2 var(--mono)}
.xbtn .d{display:block;font-size:12px;opacity:.62;margin-top:3px;font-variant-numeric:tabular-nums}
.xbtn:disabled{opacity:.45;cursor:default;transform:none}
.progress{display:none;flex-direction:column;gap:7px}
.progress.on{display:flex}
.bar{height:4px;background:#222;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--text);border-radius:4px}
.ptext,.note{margin:0;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.xbtn.wide{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.xbtn.wide svg{width:16px;height:16px;flex:none;opacity:.8}
.switch{position:relative;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;left:0;top:50%;opacity:0;width:30px;height:18px;margin:-9px 0 0;cursor:pointer}
.switch .track{position:relative;width:30px;height:18px;border-radius:999px;background:#2A2A2A;transition:background .2s;flex:none}
.switch .track::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#8F8B84;transition:transform .25s var(--ease-out),background .2s}
.switch input:checked + .track{background:var(--text)}
.switch input:checked + .track::after{transform:translateX(12px);background:#0A0A0A}
.switch input:focus-visible + .track{outline:2px solid var(--edge-strong);outline-offset:2px}
.switch .sl{font-size:12px}
.switch .sl small{display:block;color:var(--muted);font-size:12px}
.code{display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;border-radius:7px;padding:6px 10px;font:500 12px/1 var(--mono);color:var(--muted)}
.tabs button[aria-selected="true"]{background:#262626;color:var(--text)}
.code textarea{width:100%;box-sizing:border-box;height:150px;resize:vertical;background:#0F0F0F;border:1px solid var(--edge);border-radius:10px;padding:10px;font:12px/1.5 var(--mono);color:#CFCBC4;white-space:pre;overflow:auto}
.code textarea:focus{outline:none;border-color:var(--edge-strong)}
.code-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.code-row span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- stage ---------- */
.stage{position:relative;background:var(--stage);transition:background .45s ease;overflow:hidden;min-width:0;cursor:text}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.float{position:absolute;display:flex;align-items:center;gap:6px;background:rgba(10,10,10,.82);color:var(--text);border-radius:999px;padding:5px;z-index:3;cursor:default}
.float button{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:50%;background:none;transition:background .15s}
.float button:hover{background:rgba(255,255,255,.1)}
.float svg{width:16px;height:16px}
.tl{left:14px;top:14px}
.transport{left:50%;bottom:16px;transform:translateX(-50%);padding:5px 14px 5px 5px;gap:10px}
.transport input{width:min(240px,38vw);accent-color:#EDEAE4}
.transport output{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:74px}

@media (max-width:760px){
  body{overflow:auto}
  .app,.app.collapsed{display:flex;flex-direction:column-reverse;height:auto;min-height:100%}
  .stage{height:62vh;min-height:340px;flex:none}
  .panel-inner{width:auto;height:auto;overflow:visible;padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .app.collapsed .panel-inner{opacity:1;transform:none;pointer-events:auto}
  .tl{display:none}
}
@media (prefers-reduced-motion:reduce){
  .app,.panel-inner,.stage{transition:none}
  .btn.spin svg{animation:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="panel" id="panel" aria-label="Poster controls">
    <div class="panel-inner pending">
      <header class="head">
        <h1>Poster</h1>
        <p id="meta">3s loop · 30 fps</p>
      </header>

      <section class="group" aria-labelledby="l-words">
        <h2 class="label" id="l-words">Words</h2>
        <textarea class="word" id="word" rows="1" maxlength="50" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a word" aria-label="Words on the poster. Enter starts a new line, up to 3 lines."></textarea>
        <button class="btn" id="regrow" type="button" title="Regrow with a new random garden (R)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-4"/><path d="M13.6 2.2v3.2h-3.2"/></svg>
          Regrow garden
        </button>
        <div class="meter">
          <div class="meter-row"><label for="intensity">Intensity</label><output id="intensityOut" for="intensity"></output></div>
          <input type="range" id="intensity" min="0" max="100" step="1" value="45">
        </div>
        <p class="stats" id="stats" aria-live="polite"></p>
      </section>

      <section class="group" aria-labelledby="l-style">
        <h2 class="label" id="l-style">Garden</h2>
        <div class="grid three" id="styles" role="radiogroup" aria-labelledby="l-style"></div>
      </section>

      <section class="group" aria-labelledby="l-font">
        <h2 class="label" id="l-font">Typeface</h2>
        <div class="grid" id="fonts" role="radiogroup" aria-labelledby="l-font"></div>
      </section>

      <section class="group" aria-labelledby="l-motion">
        <h2 class="label" id="l-motion">Motion</h2>
        <div class="grid" id="motions" role="radiogroup" aria-labelledby="l-motion"></div>
      </section>

      <section class="group" aria-labelledby="l-palette">
        <h2 class="label" id="l-palette">Palette</h2>
        <div class="grid" id="palettes" role="radiogroup" aria-labelledby="l-palette"></div>
      </section>

      <section class="group" aria-labelledby="l-export">
        <h2 class="label" id="l-export">Export</h2>
        <div class="seg" id="ratios" role="radiogroup" aria-label="Export ratio"></div>
        <label class="switch"><input type="checkbox" id="transparent"><span class="track" aria-hidden="true"></span><span class="sl">Transparent background<small>PNG, HTML and embed code</small></span></label>
        <div class="export">
          <button class="xbtn primary" id="xmp4" type="button"><span class="t">MP4</span><span class="d" id="xmp4d">One loop</span></button>
          <button class="xbtn" id="xpng" type="button"><span class="t">PNG frames</span><span class="d" id="xpngd">Zipped</span></button>
          <button class="xbtn" id="xstill" type="button"><span class="t">Still PNG</span><span class="d">This frame</span></button>
          <button class="xbtn" id="xhtml" type="button"><span class="t">HTML file</span><span class="d">Live, any size</span></button>
          <button class="xbtn wide" id="xcode" type="button" aria-expanded="false" aria-controls="codePanel"><span><span class="t">Embed code</span><span class="d">For websites: HTML or React</span></span>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg></button>
        </div>
        <div class="code" id="codePanel" hidden>
          <div class="tabs" role="tablist" aria-label="Code format">
            <button type="button" role="tab" aria-selected="true" data-k="html">HTML</button>
            <button type="button" role="tab" aria-selected="false" data-k="react">React</button>
          </div>
          <textarea id="codeOut" readonly spellcheck="false" aria-label="Embed code"></textarea>
          <div class="code-row"><button class="btn" id="copyCode" type="button">Copy code</button><span id="codeSize"></span></div>
          <p class="note" id="codeNote">Paste into Webflow, Framer, WordPress or any HTML page. It draws live, scales to its box and pauses when off screen.</p>
        </div>
        <div class="progress" id="progress"><div class="bar"><i id="pbar"></i></div><p class="ptext" id="ptext"></p></div>
        <p class="note" id="xnote" hidden></p>
      </section>
    </div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Animated poster"></canvas>
    <div class="float tl">
      <button id="togglePanel" type="button" aria-label="Hide controls" title="Hide controls (\)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.5"/><path d="M6 2.75v10.5"/></svg>
      </button>
    </div>
    <div class="float transport">
      <button id="play" type="button" aria-label="Pause" title="Play / pause (Space)">
        <svg id="playIcon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="2.6" height="10" rx="1"/><rect x="9.4" y="3" width="2.6" height="10" rx="1"/></svg>
      </button>
      <input id="scrub" type="range" min="0" max="89" value="0" step="1" aria-label="Frame">
      <output id="frameOut">1 / 90</output>
    </div>
  </main>
</div>

<script id="bloom-engine">
/* =========================================================
   BloomType engine: a clean-room rebuild of the "type garden" reel.
   This script is also what the HTML file and embed code ship.
   Poster = f(word, seed, style, font, palette, motion, frame size, time).
   Everything that moves is periodic in the loop, so exports loop seamlessly.
   ========================================================= */
const TAU = Math.PI * 2;
const FPS = 30;

const PALETTES = [
  { id:'rose-noir', name:'Rose noir', bg:'#070707', ink:'#F3EFE7', flower:'#E3261B', detail:'#FF9E92', vine:'#2B4BE3' },
  { id:'paper',     name:'Paper',     bg:'#EEEAE3', ink:'#131313', flower:'#F0461F', detail:'#FFD0BD', vine:'#22339E' },
  { id:'midnight',  name:'Midnight',  bg:'#0C1A4C', ink:'#F4F1EA', flower:'#F3675B', detail:'#FFD6CB', vine:'#97A6F4' },
  { id:'citrus',    name:'Citrus',    bg:'#0B1410', ink:'#F3ECDC', flower:'#F7931E', detail:'#FFE3AA', vine:'#2EA36A' },
  { id:'orchid',    name:'Orchid',    bg:'#1B0A24', ink:'#F6EEF6', flower:'#E244EC', detail:'#FFC9F6', vine:'#3CB3A2' },
  { id:'moss',      name:'Moss',      bg:'#173A29', ink:'#F1EDE0', flower:'#F3B4BC', detail:'#C8505F', vine:'#8FCF94' },
  { id:'tomato',    name:'Tomato',    bg:'#F2200F', ink:'#0A0A0A', flower:'#F6EDE0', detail:'#F08A7C', vine:'#121212' },
  { id:'butter',    name:'Butter',    bg:'#FBE5A6', ink:'#141414', flower:'#D81F2B', detail:'#FFA3A5', vine:'#1E5B3B' },
];
const MOTIONS = [
  { id:'static',  name:'Static',        desc:'Still poster',        dur:3, still:true },
  { id:'breathe', name:'Breathe',       desc:'Slow sway',           dur:3 },
  { id:'grow',    name:'Grow & wither', desc:'Bloom, then back',    dur:6 },
  { id:'typed',   name:'Typed',         desc:'Type, cut, repeat',   dur:5 },
  { id:'gust',    name:'Gust',          desc:'Wind sweeps through', dur:4 },
  { id:'reach',   name:'Reach',         desc:'Stems follow a light',dur:6 },
  { id:'scatter', name:'Scatter',       desc:'Random bloom, fade',  dur:6 },
  { id:'visitor', name:'Visitor',       desc:'Butterfly drops by',  dur:7 },
];
const STYLES = [
  { id:'rose',    name:'Roses',   desc:'Climbing vines', noun:'roses', },
  { id:'tulip',   name:'Tulips',  desc:'Tall stems', noun:'tulips', },
  { id:'daisy',   name:'Daisies', desc:'Sunny rays', noun:'daisies', },
  { id:'wisteria',name:'Wisteria',desc:'Hanging clusters', noun:'clusters', },
  { id:'blossom', name:'Blossom', desc:'Petals fall', noun:'blossoms', },
  { id:'mix',     name:'Mixed',   desc:'A bit of all', noun:'flowers', },
];
const FONTS = [
  { id:'newsreader', name:'Newsreader',   family:'Newsreader',          weight:400, fb:'Georgia, serif' },
  { id:'playfair',   name:'Playfair',     family:'Playfair Display',    weight:400, fb:'Georgia, serif' },
  { id:'instrument', name:'Instrument',   family:'Instrument Serif',    weight:400, fb:'Georgia, serif' },
  { id:'fraunces',   name:'Fraunces',     family:'Fraunces',            weight:400, fb:'Georgia, serif' },
  { id:'bricolage',  name:'Bricolage',    family:'Bricolage Grotesque', weight:500, fb:'system-ui, sans-serif' },
  { id:'pinyon',     name:'Pinyon Script',family:'Pinyon Script',       weight:400, fb:'cursive' },
];
const RATIOS = [
  { id:'full', label:'Full' },
  { id:'1:1',  label:'1:1',  wh:[1080,1080] },
  { id:'4:5',  label:'4:5',  wh:[1080,1350] },
  { id:'9:16', label:'9:16', wh:[1080,1920] },
  { id:'16:9', label:'16:9', wh:[1920,1080] },
];

/* ---------- small math ---------- */
const clamp = (x,a=0,b=1) => x<a?a:x>b?b:x;
const lerp = (a,b,t) => a+(b-a)*t;
const easeOut = x => 1-Math.pow(1-x,3);
const easeIn = x => x*x*x;
const easeInOut = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const easeBack = x => { const c1=1.5, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const fract = x => x - Math.floor(x);
const angDiff = (a,b) => Math.atan2(Math.sin(a-b), Math.cos(a-b));

/* ---------- state ---------- */
const S = { word:'Growth', palette:'paper', motion:'breathe', style:'rose', font:'newsreader', ratio:'full', seed:20241031, density:1 };
let fontsReady = false, editing = false;
const pointer = { x:0, y:0, t:0, active:false };
const PAL = () => PALETTES.find(p=>p.id===S.palette) || PALETTES[0];
const MOT = () => MOTIONS.find(m=>m.id===S.motion) || MOTIONS[0];
const FNT = () => FONTS.find(f=>f.id===S.font) || FONTS[0];
const STY = () => STYLES.find(s=>s.id===S.style) || STYLES[0];
const fontCss = (size, f=FNT()) => `${f.weight} ${size}px "${f.family}", ${f.fb}`;

/* =========================================================
   Glyph fields: each letter becomes a signed distance field (em units),
   so vines can climb along its outline and weave over and under its strokes.
   ========================================================= */
const fieldCache = new Map();
function chamfer(seed, cols, rows){
  const INF = 1e9, d = new Float32Array(cols*rows), D2 = 1.4142;
  for (let i=0;i<d.length;i++) d[i] = seed[i] ? 0 : INF;
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++){ const i=y*cols+x; let v=d[i]; if (!v) continue;
    if (x>0) v=Math.min(v,d[i-1]+1); if (y>0){ v=Math.min(v,d[i-cols]+1); if (x>0) v=Math.min(v,d[i-cols-1]+D2); if (x<cols-1) v=Math.min(v,d[i-cols+1]+D2); } d[i]=v; }
  for (let y=rows-1;y>=0;y--) for (let x=cols-1;x>=0;x--){ const i=y*cols+x; let v=d[i]; if (!v) continue;
    if (x<cols-1) v=Math.min(v,d[i+1]+1); if (y<rows-1){ v=Math.min(v,d[i+cols]+1); if (x<cols-1) v=Math.min(v,d[i+cols+1]+D2); if (x>0) v=Math.min(v,d[i+cols-1]+D2); } d[i]=v; }
  return d;
}
function glyphField(ch){
  const f = FNT(), key = f.id+'|'+ch;
  if (fieldCache.has(key)) return fieldCache.get(key);
  const SZ = 100, G = 2, cw = SZ*2.8, chh = SZ*2.6, ox = SZ*0.7, oy = SZ*1.6;
  const c = document.createElement('canvas'); c.width = cw; c.height = chh;
  const g = c.getContext('2d', { willReadFrequently:true });
  g.font = fontCss(SZ, f); g.textBaseline = 'alphabetic'; g.fillStyle = '#000'; g.fillText(ch, ox, oy);
  const data = g.getImageData(0,0,cw,chh).data, cols = cw/G|0, rows = chh/G|0;
  const inside = new Uint8Array(cols*rows), outside = new Uint8Array(cols*rows);
  let ink = 0, cx = 0, cy = 0;
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++){ const a = data[((y*G+1)*cw + x*G+1)*4+3]; const i=y*cols+x;
    if (a > 128){ inside[i]=1; ink++; cx+=x; cy+=y; } else outside[i]=1; }
  const F = { ox, oy, SZ, G, cols, rows, d:null, ink:[], edge:[], empty: ink < 6 };
  if (!F.empty){
    const dOut = chamfer(inside, cols, rows), dIn = chamfer(outside, cols, rows), d = new Float32Array(cols*rows), k = G/SZ;
    for (let i=0;i<d.length;i++) d[i] = inside[i] ? -dIn[i]*k : dOut[i]*k;
    F.d = d; cx/=ink; cy/=ink;
    for (let y=1;y<rows-1;y+=1) for (let x=1;x<cols-1;x+=1){ const i=y*cols+x; if (!inside[i]) continue;
      const ex = (x*G - ox)/SZ, ey = (y*G - oy)/SZ;
      if ((x+y)%2===0) F.ink.push([ex,ey]);
      if (outside[i-1]||outside[i+1]||outside[i-cols]||outside[i+cols]) F.edge.push([ex,ey, Math.hypot(x-cx,y-cy)]); }

}
/* signed distance (em) + unit gradient pointing away from ink */
function sampleField(F, ex, ey){
  if (!F || !F.d) return null;
  const fx = (ex*F.SZ + F.ox)/F.G, fy = (ey*F.SZ + F.oy)/F.G;
  if (fx < 1 || fy < 1 || fx > F.cols-2 || fy > F.rows-2) return null;
  const at = (x,y) => { const x0=Math.floor(x), y0=Math.floor(y), tx=x-x0, ty=y-y0, i=y0*F.cols+x0;
    return lerp(lerp(F.d[i],F.d[i+1],tx), lerp(F.d[i+F.cols],F.d[i+F.cols+1],tx), ty); };
  const d = at(fx,fy), gx = at(fx+0.7,fy)-at(fx-0.7,fy), gy = at(fx,fy+0.7)-at(fx,fy-0.7), l = Math.hypot(gx,gy) || 1;
  return [d, gx/l, gy/l];
}

/* =========================================================
   Growth walker. One function grows every stem in every style:
   - hug: follow the letter's outline at a small offset (ivy climbing a wall)
   - angular: twiggy zig-zag (blossom branches)
   - otherwise: smooth meander

function growPath(F, root, h0, N, step, wav, opt, r){
  const pts=[[root[0],root[1]]]; let x=root[0], y=root[1], h=h0, seg=2+(r()*3|0);
  for (let i=1;i<=N;i++){
    const s = sampleField(F, x, y);
    if (opt.hug && i <= opt.hug && s){
      const [d,gx,gy] = s, tx=-gy*opt.dir, ty=gx*opt.dir, corr=clamp((d-opt.d0)*16,-1,1);
      h += angDiff(Math.atan2(ty-gy*corr, tx-gx*corr), h)*0.42;
    } else if (opt.angular){
      if (--seg <= 0){ h = clamp(h + (r()<.5?-1:1)*(0.22+r()*0.45), h0-0.8, h0+0.8); seg = 3+(r()*5|0); }
    } else {

      if (opt.hug && s && i < opt.hug+10) h += angDiff(Math.atan2(s[2],s[1]), h)*0.14;   // peel away from the letter
    }
    x += Math.cos(h)*step; y += Math.sin(h)*step; pts.push([x,y]);

    for (let j=0;j<26;j++){ h += dir*(0.3+j*0.014); st *= 0.94; x += Math.cos(h)*st; y += Math.sin(h)*st; pts.push([x,y]); } }

/* Over/under weave: every time a stem enters a stroke it switches layer. */
function weave(F, pts, start){

    if (inn && !prev) L ^= 1; lay[i] = L; prev = inn; }

}
function wavParams(r, k=1){ return { a1:(0.35+r()*0.6)*k, f1:0.07+r()*0.12, p1:r()*TAU, a2:(0.1+r()*0.3)*k, f2:0.22+r()*0.25, p2:r()*TAU, bend:(r()-.5)*0.03 }; }

  return { R:(big?0.1:0.07)+Math.pow(r(),1.5)*(big?0.11:0.07), n1:5+(r()*3|0), a1:0.08+r()*0.06, p1:r()*TAU, n2:9+(r()*4|0), a2:0.035+r()*0.03, p2:r()*TAU,
    spin:r()*TAU, turns:1.7+r()*0.8, lobe:[(r()-.5)*0.5,(r()-.5)*0.5, 0.55+r()*0.25], arcA:r()*TAU, arcB:r()*TAU, n:12+(r()*6|0) };
}
function endOf(r, pRose, pBud){ const x=r(); return x<pRose?'flower':x<pRose+pBud?'bud':'curl'; }

/* ---------- Roses: ivy that climbs the letters ---------- */
function genRosePlant(r, F){
  const climber = r() < 0.64, wav = wavParams(r), step = 0.026;
  let root, h0, N, opt = {};
  if (climber){
    const e = pick(r, F.edge, 6, q => q[2]);            // outer contour, not a counter
    const s = sampleField(F, e[0], e[1]) || [0,0,-1], dir = r()<.5?-1:1;
    root = [e[0], e[1]]; h0 = Math.atan2(s[1]*dir, -s[2]*dir);
    N = 36 + (r()*44|0); opt = { hug:(N*(0.42+r()*0.3))|0, dir, d0:0.004+r()*0.035 };
  } else {
    const up = r() < 0.58, q = pick(r, F.ink, 14, p => up ? -p[1] : p[1]);
    root = [q[0], q[1]]; h0 = (up ? -Math.PI/2 : Math.PI/2) + (r()<.5?-1:1)*(0.3+r()*0.9);
    N = 26 + (r()*42|0);
  }
  const end = endOf(r, 0.58, 0.14);
  const main = growPath(F, root, h0, N, step, wav, { ...opt, curl:end==='curl' }, r);
  const front = r() < 0.45, lay = weave(F, main.pts, front ? 1 : 0), twigs = [];
  if (N > 28 && r() < 0.75){ const bEnd = endOf(r, 0.45, 0.25);
    twigs.push(addTwig(F, r, main, lay, { at:Math.floor(N*(0.35+r()*0.35)), angle:0.55+r()*0.6, len:10+(r()*16|0), step:step*0.9,
      wav:{ a1:wav.a1*0.6, f1:wav.f1*1.3, p1:r()*TAU, a2:wav.a2*0.5, f2:wav.f2, p2:r()*TAU, bend:wav.bend }, curl:bEnd==='curl', end:bEnd, fl:genRose(r,false), leaves:{} })); }
  const nt = r() < 0.6 ? 1 + (r() < 0.35 ? 1 : 0) : 0;           // little corkscrew tendrils
  for (let t=0;t<nt;t++) twigs.push(addTwig(F, r, main, lay, { at:Math.floor(N*(0.25+r()*0.6)), angle:0.7+r()*0.6, len:3+(r()*5|0), step:step*0.8, wav:wavParams(r,0.5), curl:true, end:'curl', thin:true }));

}

/* ---------- Blossom: angular branches, clustered five-petal flowers ---------- */
function genSakura(r, s=1){ return { R:(0.05+r()*0.035)*s, spin:r()*TAU }; }

/* ---------- Tulips: tall stems rising from the letters, broad blade leaves ---------- */
function genTulip(r, s){ return { R:(0.085+r()*0.05)*s, ratio:1.15+r()*0.3, open:0.5+r()*0.5, tilt:(r()-.5)*0.3, bi:r()<0.3, spin:r()*TAU }; }
function genTulipPlant(r, F){
  const fromTop = r() < 0.5, q = pick(r, F.ink, 14, p => fromTop ? -p[1] : p[1]);
  const step = 0.03, N = (fromTop ? 16 : 34) + (r()*30|0);
  const wav = { a1:0.05+r()*0.1, f1:0.04+r()*0.05, p1:r()*TAU, a2:0.02+r()*0.04, f2:0.15+r()*0.15, p2:r()*TAU, bend:(r()-.5)*0.008 };
  const main = growPath(F, [q[0],q[1]], -Math.PI/2 + (r()-.5)*0.6, N, step, wav, {}, r);
  const layer = fromTop && r() < 0.5 ? 1 : 0;              // stems rising from a letter's foot stay behind it
  const flat = n => new Uint8Array(n).fill(layer), lay = flat(main.pts.length), twigs = [];
  if (r() < 0.35){ const tw = addTwig(F, r, main, lay, { at:2+(r()*3|0), angle:0.18+r()*0.3, len:Math.floor(N*(0.55+r()*0.3)), step, wav:{ ...wav, p1:r()*TAU }, end:r()<0.75 ? 'tulip' : 'tbud', fl:genTulip(r, 0.85) });
    tw.lay = flat(tw.pts.length); twigs.push(tw); }

  for (let j=0;j<nl;j++){ const side = j ? -s0 : s0; leaves.push({ i:1+(r()*3|0)+j*2, side, ang:0.22+r()*0.3, len:0.3+r()*0.26, wid:0.2+r()*0.08, bend:side*(0.12+r()*0.2), blade:true }); }
  return { kind:'tulip', main, lay, twigs, end:r()<0.86 ? 'tulip' : 'tbud', fl:genTulip(r, 1), leaves, blooms:[], ph:r()*TAU, delay:r(), sph:r(), wMul:1.6 };
}
function genBlossomPlant(r, F){

  const main = growPath(F, [q[0],q[1]], h0, N, step, null, { angular:true }, r);
  const lay = weave(F, main.pts, r()<0.42 ? 1 : 0), twigs = [], blooms = [];

  for (let t=0;t<nt;t++) twigs.push(addTwig(F, r, main, lay, { at:4+(r()*(N-8)|0), angle:0.45+r()*0.6, len:5+(r()*11|0), step:step*0.85, angular:true, end:'sakura', fl:genSakura(r) }));

  for (let c=0;c<clusters;c++){ const i = Math.floor(N*(0.3+r()*0.7)); const m = 1+(r()*3|0);
    for (let j=0;j<m;j++) blooms.push({ on:-1, i, dx:(r()-.5)*0.11, dy:(r()-.5)*0.11, kind:r()<0.8?'sakura':'sbud', fl:genSakura(r, 0.9), sph:r() }); }
  twigs.forEach((tw, ti) => { const m = r()<0.7 ? 1+(r()*2|0) : 0; for (let j=0;j<m;j++) blooms.push({ on:ti, i:tw.stem-1, dx:(r()-.5)*0.1, dy:(r()-.5)*0.1, kind:r()<0.75?'sakura':'sbud', fl:genSakura(r,0.85), sph:r() }); });
  return { kind:'blossom', main, lay, twigs, end:'sakura', fl:genSakura(r,1.15), leaves:genLeaves(r, main.stem, { start:6, len:0.05, lenR:0.03, gap:9, wid:0.36 }), blooms, ph:r()*TAU, delay:r(), sph:r(), wMul:2.1 };
}

/* Plants per letter: a seeded pool, of which a random-density share is shown. */
const plantCache = new Map();
const VINE_FLOWERS = ['flower','tulip','daisy','poppy','wisteria'];   // 'flower' is the rose
const plantKey = (ch, k) => [S.seed, S.style, S.font, k, ch].join('|');
function lettersPlants(ch, k){
  const key = plantKey(ch, k);
  if (plantCache.has(key)) return plantCache.get(key);
  const F = glyphField(ch), r = mulberry32(hash(S.seed, S.style, k, ch)), out = { plants:[], bias:r() };
  if (!F.empty){ const gen = S.style==='blossom' ? genBlossomPlant : S.style==='tulip' ? genTulipPlant : genRosePlant;
    for (let p=0;p<8;p++) out.plants.push(gen(r, F));
    if (S.style==='daisy' || S.style==='wisteria' || S.style==='mix'){ const rk = mulberry32(hash(S.seed, 'kind', k, ch));
      const head = () => S.style==='mix' ? VINE_FLOWERS[(rk()*VINE_FLOWERS.length)|0] : S.style;
      for (const pl of out.plants){ if (pl.end==='flower') pl.end = head(); for (const tw of pl.twigs) if (tw.end==='flower') tw.end = head(); } } }
  plantCache.set(key, out); return out;
}
function plantCount(n, bias){
  const styleK = S.style==='blossom' ? 0.8 : S.style==='tulip' ? 0.9 : 1;
  const base = clamp(14/Math.max(n,2), 1, 4.2) * S.density * styleK;
  return clamp(Math.round(base*(0.55 + bias*0.9)), 0, 8);
}
function looseBlooms(W,H){
  const r = mulberry32(hash(S.seed,'loose',W,H)), out=[], n = 6 + (r()*6|0);
  for (let i=0;i<n;i++) out.push({ x:0.08+r()*0.84, y:r()<.5 ? 0.06+r()*0.24 : 0.7+r()*0.24, fl:genRose(r,r()<.4), sk:genSakura(r,1.3), ph:r(), leaf:r()*TAU });
  return out;
}

/* ---------- layout: the word sits centred in whatever frame it's given ---------- */
const mcv = document.createElement('canvas'), mctx = mcv.getContext('2d');
let layoutCache = null;
function layout(W,H){
  const key = [S.word, S.font, S.style, W, H, fontsReady].join('|');
  if (layoutCache && layoutCache.key===key) return layoutCache;
  const lines = (S.word || ' ').split('\n'), nl = lines.length, LH = 1.08;   // baseline to baseline, in em
  mctx.font = fontCss(100);
  const w100 = Math.max(...lines.map(l => mctx.measureText(l || ' ').width), 1);
  let fs = Math.min((W*(H > W*1.2 ? 0.74 : 0.64)) / (w100/100), H*(nl > 1 ? 0.38 : 0.27) / (1 + (nl-1)*LH*0.85), W*0.4);
  mctx.font = fontCss(fs);
  // tulips rise upward, so the block sits lower to give them room
  const base0 = H*0.5 + fs*(S.style==='tulip' ? 0.55 : 0.3) - (nl-1)*fs*LH/2, pos = [], rows = [];
  let tw = 0, k = 0;
  lines.forEach((text, li) => { const w = mctx.measureText(text).width, x0 = (W - w)/2, base = base0 + li*fs*LH; tw = Math.max(tw, w);
    rows.push({ text, x0, base, start:k });
    for (let j=0;j<=text.length;j++) pos.push([x0 + mctx.measureText(text.slice(0,j)).width, base]);
    k += text.length + 1; });
  layoutCache = { key, fs, pos, rows, tw, base:base0, font:fontCss(fs) };
  return layoutCache;
}

/* =========================================================
   Motion: per-frame parameters, all periodic in u ∈ [0,1).
   ========================================================= */
function motionFrame(u, W, H, fs, live){
  const id = S.motion, M = { id, u, W, H, fs, sway:0.02, cycles:1, light:null, rot:0.06 };
  if (id==='static'){ M.sway=0; M.rot=0; M.cycles=0; M.still=true; }
  if (id==='breathe'){ M.sway=0.045; M.rot=0.1; }
  if (id==='gust'){ M.sway=0.014; M.cycles=2; M.gustX = W*(-0.4 + 1.8*u); M.gustAmp=0.3; }
  if (id==='reach'){ M.sway=0.014; M.cycles=2;
    let lx = W*0.5 + Math.min(W*0.33, fs*2.2)*Math.sin(TAU*u), ly = H*0.5 - fs*0.25 + Math.min(H*0.25, fs*1.3)*Math.sin(2*TAU*u+0.5);
    if (live && pointer.active && performance.now()-pointer.t < 2500){ lx = pointer.x; ly = pointer.y; }
    M.light = [lx,ly]; }
  if (id==='visitor') M.cycles = 2;
  return M;
}
function gustEnv(M, x){ const d=(x-M.gustX)/(Math.max(M.W*0.2, M.fs*1.2)); return Math.exp(-d*d); }
function displace(px,py,nx,ny,s,ph,M){
  let dx=0, dy=0;
  const w = Math.pow(s,1.6) * M.sway*M.fs * Math.sin(TAU*M.u*M.cycles + ph + s*1.4);

/* ---------- live-only state: per-letter birth times, per-plant visibility smoothing ---------- */
let births = [];
const visMap = new Map();
let lastNow = performance.now(), frameDt = 16;

/* =========================================================

   ========================================================= */
function render(ctx, W, H, u, live, now, transparent){
  const base = PAL(), P = { ...base, shade: mix(base.flower, '#000000', 0.13), petalMid: mix(base.flower, '#000000', 0.06), vineShade: mix(base.vine, '#000000', 0.25) };
  const L = layout(W,H), fs = L.fs, word = S.word, n = word.length;

  const items = [];

    const ch = word[k];

      if (vis <= 0.001) continue;
      const pl = lp.plants[p];
      let g = motionGrow(M, pl, k, n) * vis;
      if (live) g *= liveGrow(k, now);
      if (g <= 0) continue;

    for (const b of looseBlooms(W,H)){ const bl = scatterBloom(b.ph, u); if (bl<=0) continue;
      const x=b.x*W, y=b.y*H;
      if (S.style==='blossom'){ drawSakura(ctx, x, y, b.sk.R*fs, b.sk.spin, bl, P); continue; }
      const kind = S.style==='mix' ? VINE_FLOWERS[(b.ph*VINE_FLOWERS.length)|0] : S.style==='rose' ? 'flower' : S.style;
      drawLeaf(ctx, x, y, b.leaf, b.fl.R*fs*1.6*clamp(bl), 0.34, P);
      drawFlower(ctx, kind, x, y, b.fl.R*fs, -Math.PI/2, Math.sin(TAU*u+b.ph*TAU)*0.1, b.fl, bl, P); }
  }
  const spots = [];
  for (const it of items) drawPlant(ctx, it, M, P, 0, spots);
  ctx.font = L.font; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = P.ink;
  const shown = M.id==='typed' ? typedCount(u, n) : n;
  for (const row of L.rows) ctx.fillText(row.text.slice(0, clamp(shown - row.start, 0, row.text.length)), row.x0, row.base);
  let caret = false;
  if (M.id==='typed') caret = (u>0.5 && u<0.78) ? fract(u*5)<0.5 : (u>0.02 && u<0.94);
  else if (live && editing) caret = (now % 1060) < 560;
  if (caret){ const cp = L.pos[Math.min(shown, L.pos.length-1)]; ctx.fillStyle = P.ink; ctx.fillRect(cp[0] + fs*0.05, cp[1] - fs*0.74, Math.max(1.5, fs*0.016), fs*0.92); }
  for (const it of items) drawPlant(ctx, it, M, P, 1, spots);
  if (S.style==='blossom') drawFalling(ctx, M, P);
  if (M.gustX!==undefined) drawPetals(ctx, M, P);
  if (M.id==='visitor') drawButterfly(ctx, M, P, spots);
}

  document.getElementById('meta').textContent = m.still ? 'Still poster' : `${m.dur}s loop · ${FPS} fps`;
  scrub.max = frames-1;
  document.querySelector('.transport').hidden = !!m.still;
  document.getElementById('xmp4d').textContent = m.still ? `${W}×${H} · ${m.dur}s hold` : `${W}×${H} · ${m.dur}s`;
  document.getElementById('xpngd').textContent = m.still ? `1 PNG, ${W}×${H}` : `${frames} PNGs, zipped`;
}

document.addEventListener('keydown', (e) => {
  if (e.target === wordEl || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ' && !(e.target instanceof HTMLButtonElement) && e.target.type !== 'range'){ e.preventDefault(); setPlaying(!playing); }
  else if (e.key === '\\') togglePanel();
  else if ((e.key === 'r' || e.key === 'R') && !exporting) regrow();
});

/* =========================================================
   Export: deterministic, frame by frame (never real-time).
   Each ratio recomposes the poster to its own frame, so nothing is cut.
   ========================================================= */
// resolves to the viewer's download capability inside Claude, or null on a normal website
const downloadsReady = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
const scriptOnce = {};
function loadScript(src){ return scriptOnce[src] || (scriptOnce[src] = new Promise((res, rej) => { const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>{ delete scriptOnce[src]; rej(new Error('could not load the encoder')); }; document.head.appendChild(s); })); }
const progress = document.getElementById('progress'), pbar = document.getElementById('pbar'), ptext = document.getElementById('ptext'), xnote = document.getElementById('xnote');
const xBtns = [document.getElementById('xmp4'), document.getElementById('xpng')];
let exporting = false;
function busy(on, text){ exporting = on; document.querySelectorAll('.panel-inner > section:not(:last-child)').forEach(sec => { sec.inert = on; }); xBtns.forEach(b=>b.disabled=on); progress.classList.toggle('on', on); if (text) ptext.textContent = text; if (!on) pbar.style.width='0'; }
function note(msg){ xnote.hidden = !msg; xnote.textContent = msg || ''; }
const yieldFrame = () => new Promise(r => setTimeout(r, 0));
function fileBase(){ const w = (S.word||'poster').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'poster'; return `${w}-${S.style}-${S.motion}-${S.palette}-${S.ratio.replace(':','x')}`; }

async function saveFile(name, blob){
  const cap = await downloadsReady;
  if (cap){
    try { await cap.save({ filename:name, data:blob }); return 'Saved '+name; }
    catch(e){ if (e && e.code === 'declined') return 'Save cancelled.'; if (e && e.code === 'rate_limited') return 'Another save is still open. Finish it, then export again.'; if (e && e.code === 'too_large') return 'That file is too large to save here. Try a smaller ratio.';
      return 'Could not save the file here. Open BloomType on its own site to download it.'; }
  }
  if (window.claude) return 'Saving is not available in this view. Open BloomType on its own site to download it.';   // a plain download link is blocked inside Claude
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  return 'Saved '+name;
}
function exportCanvas(){ const [W,H] = exportDims(); const c = document.createElement('canvas'); c.width=W; c.height=H; return { c, W, H, x:c.getContext('2d') }; }

async function exportPNG(){
  note(''); busy(true, 'Preparing…');
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js');
    const { c, W, H, x } = exportCanvas(), frames = MOT().still ? 1 : Math.round(MOT().dur*FPS), files = {}, base = fileBase();
    for (let i=0;i<frames;i++){
      render(x, W, H, i/frames, false, 0, transparentOn());
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      files[`${base}/${base}-${String(i+1).padStart(4,'0')}.png`] = [new Uint8Array(await blob.arrayBuffer()), { level:0 }];
      pbar.style.width = ((i+1)/frames*92)+'%'; ptext.textContent = `Rendering frame ${i+1} of ${frames}`;
    }
    ptext.textContent = 'Zipping…'; await yieldFrame();
    const zip = fflate.zipSync(files); pbar.style.width = '100%';
    note(await saveFile(base+'-frames.zip', new Blob([zip], { type:'application/zip' })));
  } catch(e){ note('Export failed: '+(e && e.message ? e.message : e)+'. Try again, or try the MP4.'); }
  busy(false);
}
async function pickCodec(W,H){
  if (!('VideoEncoder' in window)) return null;
  for (const codec of ['avc1.640033','avc1.640028','avc1.4D0033','avc1.42E033','avc1.42001f']){
    try { const s = await VideoEncoder.isConfigSupported({ codec, width:W, height:H, bitrate:12e6, framerate:FPS }); if (s.supported) return codec; } catch(e){}
  }
  return null;
}
async function exportMP4(){
  note(''); busy(true, 'Preparing…');
  try {
    const { c, W, H, x } = exportCanvas(), frames = Math.round(MOT().dur*FPS);
    const codec = await pickCodec(W,H);
    if (!codec){ busy(false); return exportWebM(); }
    await loadScript('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js');
    const muxer = new Mp4Muxer.Muxer({ target:new Mp4Muxer.ArrayBufferTarget(), video:{ codec:'avc', width:W, height:H, frameRate:FPS }, fastStart:'in-memory' });
    let err = null;
    const enc = new VideoEncoder({ output:(chunk, meta) => muxer.addVideoChunk(chunk, meta), error:(e) => { err = e; } });
    enc.configure({ codec, width:W, height:H, bitrate:14e6, framerate:FPS, avc:{ format:'avc' } });
    for (let i=0;i<frames;i++){
      if (err) throw err;
      render(x, W, H, i/frames, false, 0);
      const vf = new VideoFrame(c, { timestamp:Math.round(i*1e6/FPS), duration:Math.round(1e6/FPS) });
      enc.encode(vf, { keyFrame: i % FPS === 0 }); vf.close();
      while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 4));
      pbar.style.width = ((i+1)/frames*95)+'%'; ptext.textContent = `Encoding frame ${i+1} of ${frames}`;
      if (i % 4 === 0) await yieldFrame();
    }
    await enc.flush(); enc.close(); if (err) throw err;
    muxer.finalize(); pbar.style.width = '100%';
    note(await saveFile(fileBase()+'.mp4', new Blob([muxer.target.buffer], { type:'video/mp4' })));
  } catch(e){ note('Export failed: '+(e && e.message ? e.message : e)+'. Try PNG frames instead.'); }
  busy(false);
}
async function exportWebM(){
  busy(true, 'This browser has no MP4 encoder. Recording a WebM in real time…');
  try {
    const { c, W, H, x } = exportCanvas(), dur = MOT().dur, stream = c.captureStream(FPS);
    const type = ['video/webm;codecs=vp9','video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    if (!type) throw new Error('video recording is not supported in this browser');
    const rec = new MediaRecorder(stream, { mimeType:type, videoBitsPerSecond:10e6 }), chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r); rec.start();
    const t0 = performance.now();
    await new Promise(res => { (function step(){ const el=(performance.now()-t0)/1000, u = Math.min(el/dur, 0.9999);
      render(x, W, H, u, false, 0); pbar.style.width = (u*100)+'%'; ptext.textContent = `Recording ${el.toFixed(1)}s of ${dur}s`;
      if (el < dur) requestAnimationFrame(step); else res(); })(); });
    rec.stop(); await done;
    note(await saveFile(fileBase()+'.webm', new Blob(chunks, { type:'video/webm' })));
  } catch(e){ note('Export failed: '+(e && e.message ? e.message : e)+'. Try PNG frames instead.'); }
  busy(false);
}
document.getElementById('xmp4').addEventListener('click', exportMP4);
document.getElementById('xpng').addEventListener('click', exportPNG);

async function exportStill(){

}

const GF = { newsreader:'Newsreader:opsz,wght@6..72,400', playfair:'Playfair+Display:wght@400', instrument:'Instrument+Serif', fraunces:'Fraunces:opsz,wght@9..144,400', bricolage:'Bricolage+Grotesque:opsz,wght@12..96,500', pinyon:'Pinyon+Script' };
let engineSrc = null;
function engineSource(){
  if (engineSrc) return engineSrc;
  engineSrc = document.getElementById('bloom-engine').textContent.replace(/\/\*[\s\S]*?\*\//g, '').split('\n').map(l => l.trim()).filter(Boolean).join('\n');
  return engineSrc;
}
function embedConfig(){ return { word:S.word, palette:S.palette, motion:S.motion, style:S.style, font:S.font, seed:S.seed, density:S.density }; }
/* One self-contained function: the engine plus a tiny player. Returns a cleanup function. */
function runtimeSource(){
  const t = transparentOn();
  return `function mountBloomType(host){
${engineSource()}
Object.assign(S, ${JSON.stringify(embedConfig()).replace(/</g, '\\u003c')});
fontsReady = true;
var cv = document.createElement('canvas'); cv.setAttribute('aria-hidden', 'true'); cv.style.cssText = 'display:block;width:100%;height:100%';
host.appendChild(cv);
var cx = cv.getContext('2d'), W = 0, H = 0, dpr = 1, raf = 0, seen = true, ready = false, t0 = performance.now(), dur = MOT().dur;
var still = !!MOT().still || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function draw(now){ if (!ready || !W) return; cx.setTransform(dpr, 0, 0, dpr, 0, 0); render(cx, W, H, still ? 0.5 : fract((now - t0) / 1000 / dur), false, 0, ${t}); }
function size(){ var r = host.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 2); W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height)); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); draw(performance.now()); }
function loop(now){ if (seen) draw(now); raf = requestAnimationFrame(loop); }
var ro = new ResizeObserver(size); ro.observe(host);
var io = new IntersectionObserver(function(e){ seen = e[0].isIntersecting; }); io.observe(host);
var href = 'https://fonts.googleapis.com/css2?family=${GF[S.font] || GF.newsreader}&display=swap';
if (!document.querySelector('link[href="' + href + '"]')){ var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l); }
function start(){ if (ready) return; ready = true; fieldCache.clear(); plantCache.clear(); layoutCache = null; size(); if (!still) raf = requestAnimationFrame(loop); }
var tries = 0;
(function waitFont(){ document.fonts.load(fontCss(100)).then(function(f){ if (f.length || ++tries > 40) start(); else setTimeout(waitFont, 100); }, start); })();
var fallback = setTimeout(start, 4000);
return function(){ clearTimeout(fallback); cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); cv.remove(); };
}`;
}
const escHtml = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function describe(){ return `"${S.word.replace(/[<>]/g,'').replace(/\n/g,' / ')}" · ${STY().name} · ${FNT().name} · ${MOT().name} · ${PAL().name}`; }
function aspectCss(){ const [W,H] = exportDims(); return `${W} / ${H}`; }
function htmlSnippet(){
  const bg = transparentOn() ? 'transparent' : PAL().bg;
  return `<!-- BloomType poster: ${describe()} -->
<div role="img" aria-label="${escHtml(S.word)}" style="width:100%;aspect-ratio:${aspectCss()};background:${bg}"></div>
<script>
(function(){
var host = document.currentScript.previousElementSibling;   // each embed draws into the box right before it
${runtimeSource()}
mountBloomType(host);
})();
<\/script>`;
}
function reactSnippet(){
  const bg = transparentOn() ? 'transparent' : PAL().bg;
  return `// BloomType poster: ${describe()}
// Drop this file into a React or Next.js project. It renders on the client only.
import { useEffect, useRef } from "react";

export default function BloomTypePoster({ className, style }) {
  const ref = useRef(null);
  useEffect(() => mountBloomType(ref.current), []);
  return (
    <div
      ref={ref}
      role="img"
      aria-label={${JSON.stringify(S.word)}}
      className={className}
      style={{ width: "100%", aspectRatio: "${aspectCss()}", background: "${bg}", ...style }}
    />
  );
}

${runtimeSource()}
`;
}
const codeOut = document.getElementById('codeOut'), codePanel = document.getElementById('codePanel'), xcode = document.getElementById('xcode');

  document.getElementById('codeSize').textContent = `${(new Blob([code]).size/1024).toFixed(1)} KB · ${codeKind === 'react' ? 'BloomTypePoster.jsx' : 'paste anywhere'}`;
  document.getElementById('codeNote').textContent = codeKind === 'react'
    ? 'Save as BloomTypePoster.jsx and render <BloomTypePoster />. Size it with className or style.'
    : 'Paste into Webflow, Framer, WordPress or any HTML page. It draws live, scales to its box and pauses when off screen.';
}
xcode.addEventListener('click', () => { codeOpen = !codeOpen; codePanel.hidden = !codeOpen; xcode.setAttribute('aria-expanded', String(codeOpen)); if (codeOpen) refreshCode(); });
document.querySelectorAll('.tabs [role="tab"]').forEach(t => t.addEventListener('click', () => {
  codeKind = t.dataset.k; document.querySelectorAll('.tabs [role="tab"]').forEach(x => x.setAttribute('aria-selected', String(x === t))); refreshCode(); }));

});
